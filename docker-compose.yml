services:
  api:
    image: support-resolution-assistant:local
    build: .
    profiles: ["app"]
    env_file: .env
    environment:
      RERANKER_INSTANCES: "2"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      LEXICAL_BACKEND: postgres
      LLM_ENABLED: ${LLM_ENABLED:-true}
      RATE_LIMIT_BACKEND: postgres
      SOLUTION_CACHE_ENABLED: "true"
      LLM_SPLIT_REVIEW: "true"
      CORPUS_DIR: ${CORPUS_DIR:-data/synthetic/telecom_v3_1}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - appdata:/service/data
      - modelcache:/service/cache
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: pgvector/pgvector:pg16
    container_name: support-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  appdata:
  modelcache:

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
<title id="title">Support ticket resolution architecture</title><desc id="desc">A Dockerized FastAPI service understands complaints with Groq or Gemini, retrieves KB and resolved ticket evidence from PostgreSQL, and generates validated cited troubleshooting guidance. Local inference and drafting provide a fallback.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#126954"/></marker></defs>

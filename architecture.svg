<g font-family="Segoe UI,Arial,sans-serif" fill="#18332f" text-anchor="middle"><text x="550" y="36" font-size="24" font-weight="700">Complaint to cited troubleshooting guidance</text>
<rect x="190" y="66" width="870" height="210" rx="16" fill="#e5f2eb" stroke="#bdd2c9"/><text x="625" y="94" font-size="15">Docker container · FastAPI microservice</text>
<g fill="white" stroke="#126954"><rect x="20" y="126" width="150" height="104" rx="10"/><rect x="216" y="126" width="236" height="104" rx="10"/><rect x="482" y="126" width="236" height="104" rx="10"/><rect x="748" y="126" width="286" height="104" rx="10"/><rect x="482" y="310" width="236" height="82" rx="10"/></g>
<g font-size="16"><text x="95" y="164">Agent UI / API</text><text x="95" y="190">Raw complaint</text><text x="334" y="153">Understand</text><text x="334" y="179">Groq → Gemini → local</text><text x="334" y="206" font-size="13">Category · product · severity · sentiment</text><text x="600" y="153">Retrieve evidence</text><text x="600" y="179">pgvector + lexical + RRF</text><text x="600" y="206" font-size="13">KB procedures + resolved histories</text><text x="891" y="153">Draft and validate</text><text x="891" y="179">Grounded LLM steps + citations</text><text x="891" y="206" font-size="13">Fallback: cited local plan · clarify if needed</text><text x="600" y="342">PostgreSQL + pgvector</text><text x="600" y="369" font-size="13">Separate container · durable index</text></g>

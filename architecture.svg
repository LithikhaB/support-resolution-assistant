<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1565" height="1250" viewBox="0 0 1565 1250" role="img" aria-labelledby="title desc">
<title id="title">Telecom support: evidence-controlled request and evolution flow</title>
<desc id="desc">Local understanding, revision-aware reuse, hybrid search, applicability, deterministic draft, optional provider wording, validation, advisory policy and response. PostgreSQL, caches, live ingestion, monitoring and dev CI gate are shown separately.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#466374" /></marker></defs>
<rect width="1565" height="1250" fill="#ffffff" />
<text x="50" y="45" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#173746">Telecom support: source-backed investigation, agent-reviewed decisions</text>
<text x="50" y="77" font-family="Arial,sans-serif" font-size="16" fill="#526b78">Solid: main flow / data publication   •   Dashed: optional calls, cache reuse and fallback   •   Defaults: example environment + Compose</text>
<rect x="50" y="110" width="340" height="95" rx="12" fill="#effaf7" stroke="#147d70" stroke-width="1.6" />
<text x="66" y="137" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193e4d">Agent UI / API</text>
<text x="66" y="162" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Complaint + issue-linked follow-ups</text>
<text x="66" y="184" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Fields, cited plan, S = KB / T = tickets</text>
<rect x="50" y="255" width="340" height="110" rx="12" fill="#effaf7" stroke="#147d70" stroke-width="1.6" />
<text x="66" y="282" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193e4d">Validate / protect / admit</text>
<text x="66" y="307" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Pydantic bounds; credential scrubbing</text>
<text x="66" y="329" font-family="Arial,sans-serif" font-size="13" fill="#294f60">FIFO queue; shared token budgets</text>
<text x="66" y="351" font-family="Arial,sans-serif" font-size="13" fill="#294f60">429 / 503 on overload</text>
<rect x="50" y="415" width="340" height="120" rx="12" fill="#effaf7" stroke="#147d70" stroke-width="1.6" />
<text x="66" y="442" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193e4d">Understand</text>
<text x="66" y="467" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Local logistic classifier + quoted rules</text>
<text x="66" y="489" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Products / severity / sentiment / attempts</text>
<text x="66" y="511" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Optional quoted LLM extraction</text>
<rect x="50" y="585" width="340" height="120" rx="12" fill="#effaf7" stroke="#147d70" stroke-width="1.6" />
<text x="66" y="612" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193e4d">Evidence reuse lookup</text>
<text x="66" y="637" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Revision-keyed JSON evidence cache</text>
<text x="66" y="659" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Reviewed owner-scoped outcomes → KB refs</text>
<text x="66" y="681" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Eligible constrained semantic reuse</text>
<rect x="440" y="585" width="360" height="120" rx="12" fill="#effaf7" stroke="#147d70" stroke-width="1.6" />
<text x="456" y="612" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193e4d">Hybrid candidate search / rank</text>
<text x="456" y="637" font-family="Arial,sans-serif" font-size="13" fill="#294f60">MiniLM cosine + PostgreSQL full-text</text>
<text x="456" y="659" font-family="Arial,sans-serif" font-size="13" fill="#294f60">RRF → diversity → optional cross-encoder</text>
<text x="456" y="681" font-family="Arial,sans-serif" font-size="13" fill="#294f60">In-memory BM25: exploration alternative</text>
<rect x="440" y="755" width="360" height="105" rx="12" fill="#effaf7" stroke="#147d70" stroke-width="1.6" />
<text x="456" y="782" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193e4d">Applicability / selection</text>
<text x="456" y="807" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Symptom, service and timing conflicts</text>
<text x="456" y="829" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Local ranking; optional LLM supplied-ID choice</text>
<text x="456" y="851" font-family="Arial,sans-serif" font-size="13" fill="#294f60">KB + up to 3 historical comparisons</text>
<rect x="440" y="910" width="360" height="105" rx="12" fill="#effaf7" stroke="#147d70" stroke-width="1.6" />
<text x="456" y="937" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193e4d">Deterministic draft</text>
<text x="456" y="962" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Ordered checks → gated fix → completion</text>
<text x="456" y="984" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Skip prior attempts; preserve restrictions</text>
<text x="456" y="1006" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Exact quoted procedure / ticket evidence</text>
<rect x="440" y="1065" width="360" height="110" rx="12" fill="#effaf7" stroke="#147d70" stroke-width="1.6" />
<text x="456" y="1092" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193e4d">Validate / policy / response</text>
<text x="456" y="1117" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Exact spans, citations, conditional rendering</text>
<text x="456" y="1139" font-family="Arial,sans-serif" font-size="13" fill="#294f60">clarify / agent_review / escalate</text>
<text x="456" y="1161" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Agent review required; no handoff execution</text>
<rect x="855" y="110" width="660" height="155" rx="12" fill="#f4f0ff" stroke="#7a5bb5" stroke-width="1.6" />
<text x="871" y="137" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193e4d">Configurable hosted language roles</text>
<text x="871" y="162" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Example split=true: Groq wording / Gemini critique</text>
<text x="871" y="184" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Split=false: Groq → Gemini generation; same-provider critique</text>
<text x="871" y="206" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Extraction and selection: optional, disabled by example</text>
<text x="871" y="228" font-family="Arial,sans-serif" font-size="13" fill="#294f60">No keys / quota / invalid wording → local fallback</text>
<rect x="855" y="910" width="300" height="105" rx="12" fill="#f4f0ff" stroke="#7a5bb5" stroke-width="1.6" />
<text x="871" y="937" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193e4d">Optional LLM wording</text>
<text x="871" y="962" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Editable wording only; protected steps kept</text>
<text x="871" y="984" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Structural checks + model critique</text>
<text x="871" y="1006" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Reject → deterministic plan</text>
<rect x="440" y="110" width="360" height="155" rx="12" fill="#edf4fb" stroke="#38658b" stroke-width="1.6" />
<text x="456" y="137" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193e4d">Caches (bounded)</text>
<text x="456" y="162" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Process: understanding / retrieval / reuse</text>
<text x="456" y="184" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Disk: evidence / masked wording / critiques</text>
<text x="456" y="206" font-family="Arial,sans-serif" font-size="13" fill="#294f60">TTL: 120 s process; up to 1 day disk</text>
<text x="456" y="228" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Revision / payload keys; revalidate hits</text>
<rect x="855" y="415" width="660" height="145" rx="12" fill="#edf4fb" stroke="#38658b" stroke-width="1.6" />
<text x="871" y="442" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193e4d">PostgreSQL + pgvector</text>
<text x="871" y="467" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Documents → chunks: vector(384), cosine HNSW, GIN full-text</text>
<text x="871" y="489" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Document fingerprints / published index revision</text>
<text x="871" y="511" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Redacted conversations, events, reviewed simulated outcomes</text>
<text x="871" y="533" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Shared request / provider budget tokens</text>
<rect x="1210" y="755" width="305" height="190" rx="12" fill="#edf4fb" stroke="#38658b" stroke-width="1.6" />
<text x="1226" y="782" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193e4d">Ingestion and evolution</text>
<text x="1226" y="807" font-family="Arial,sans-serif" font-size="13" fill="#294f60">POST /api/v1/ingest + X-Admin-Key</text>
<text x="1226" y="829" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Validate → stage → chunk/manifests</text>
<text x="1226" y="851" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Incremental index; lock (8041,2)</text>
<text x="1226" y="873" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Publish / rollback / revision changes</text>
<text x="1226" y="895" font-family="Arial,sans-serif" font-size="13" fill="#294f60">New KB searchable immediately</text>
<text x="1226" y="917" font-family="Arial,sans-serif" font-size="13" fill="#294f60">New class: examples + map</text>
<text x="1226" y="939" font-family="Arial,sans-serif" font-size="13" fill="#294f60">train / calibrate + restart</text>
<rect x="855" y="1065" width="660" height="110" rx="12" fill="#edf4fb" stroke="#38658b" stroke-width="1.6" />
<text x="871" y="1092" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193e4d">Monitoring and verification</text>
<text x="871" y="1117" font-family="Arial,sans-serif" font-size="13" fill="#294f60">/api/v1/health: process; /ready: DB schema/index state</text>
<text x="871" y="1139" font-family="Arial,sans-serif" font-size="13" fill="#294f60">/api/v1/metrics JSON; /metrics Prometheus text</text>
<text x="871" y="1161" font-family="Arial,sans-serif" font-size="13" fill="#294f60">CI: lint / unit + DB / UI tests / frozen local dev eval gate</text>
<rect x="50" y="910" width="340" height="265" rx="12" fill="#fff6e7" stroke="#b28538" stroke-width="1.6" />
<text x="66" y="937" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193e4d">Evidence boundaries</text>
<text x="66" y="962" font-family="Arial,sans-serif" font-size="13" fill="#294f60">AI-authored synthetic baseline</text>
<text x="66" y="984" font-family="Arial,sans-serif" font-size="13" fill="#294f60">All supplied resolved outcomes simulated</text>
<text x="66" y="1006" font-family="Arial,sans-serif" font-size="13" fill="#294f60">History similarity ≠ current diagnosis</text>
<text x="66" y="1028" font-family="Arial,sans-serif" font-size="13" fill="#294f60">KB gates require authorized checks</text>
<text x="66" y="1050" font-family="Arial,sans-serif" font-size="13" fill="#294f60">Citation validity ≠ semantic quality</text>
<text x="66" y="1072" font-family="Arial,sans-serif" font-size="13" fill="#294f60">No repair / refund / handoff performed</text>

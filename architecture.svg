<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
<title id="title">Telecom support resolution assistant architecture</title>
<desc id="desc">Agent input is understood, retrieved with hybrid search, drafted, validated and returned with citations. Evidence and language caches reduce repeat work. PostgreSQL holds vector, lexical and conversation data. Validated staged updates feed incremental indexing and category mapping. Provider failures retain a local plan. Health, metrics and a frozen development CI gate provide operational checks.</desc>
<defs>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#25635d"/></marker>
 <marker id="fallback" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a96712"/></marker>
 <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#173c38} .title{font-size:29px;font-weight:700} .label{font-size:20px;font-weight:600} .detail{font-size:16px} .note{font-size:15px;fill:#426460} .box{fill:white;stroke:#52968d;stroke-width:1.6;rx:12} .cache{fill:#ecf5ff;stroke:#5f88b1;stroke-width:1.6;rx:12} .flow{fill:none;stroke:#25635d;stroke-width:2;marker-end:url(#arrow)} .dash{stroke-dasharray:6 5} .safe{fill:#fff5e6;stroke:#c48a36;stroke-width:1.6;rx:12} .fallback{fill:none;stroke:#a96712;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#fallback)}</style>
</defs>
<rect width="1600" height="860" fill="#f5f8f7"/>
<text x="30" y="42" class="title">Telecom support: complaint → evidence → conditional agent plan</text>
<text x="30" y="70" class="note">FastAPI microservice · agent review required · AI-authored synthetic evidence · no repairs or handoffs executed</text>
<rect x="520" y="95" width="250" height="70" class="cache"/><text x="537" y="122" class="label">Solution evidence cache</text><text x="537" y="147" class="detail">24h JSON · revision + facts key</text>
<rect x="805" y="95" width="210" height="70" class="cache"/><text x="822" y="122" class="label">LLM wording cache</text><text x="822" y="147" class="detail">Masked, checked · 24h TTL</text>
<rect x="30" y="205" width="180" height="140" class="box"/><text x="47" y="236" class="label">UI / API</text><text x="47" y="263" class="detail">Complaint + replies</text><text x="47" y="290" class="detail">Structured answers</text><text x="47" y="317" class="detail">Admission limits</text>
<rect x="245" y="205" width="240" height="140" class="box"/><text x="262" y="236" class="label">Understand</text><text x="262" y="263" class="detail">Local classifier + quoted rules</text><text x="262" y="290" class="detail">Optional LLM extraction:</text><text x="262" y="317" class="detail">Groq → Gemini → local *</text>
<rect x="520" y="205" width="250" height="140" class="box"/><text x="537" y="236" class="label">Hybrid retrieve</text><text x="537" y="263" class="detail">Cache → reviewed recent cases</text><text x="537" y="290" class="detail">pgvector + lexical BM25/FTS</text><text x="537" y="317" class="detail">RRF + optional rerank</text>
<rect x="805" y="205" width="210" height="140" class="box"/><text x="822" y="236" class="label">Draft</text><text x="822" y="263" class="detail">Ordered source steps</text><text x="822" y="290" class="detail">Skip completed checks</text><text x="822" y="317" class="detail">Optional Groq wording</text>
<rect x="1050" y="205" width="240" height="140" class="box"/><text x="1067" y="236" class="label">Citation / grounding</text><text x="1067" y="263" class="detail">Exact quotes + source IDs</text><text x="1067" y="290" class="detail">Protected gates + repair steps</text><text x="1067" y="317" class="detail">Gemini critique in split mode *</text>
<rect x="1325" y="205" width="245" height="140" class="box"/><text x="1342" y="236" class="label">Response</text><text x="1342" y="263" class="detail">Decision + priority + fields</text><text x="1342" y="290" class="detail">Numbered cited plan</text><text x="1342" y="317" class="detail">Provider / fallback disclosure</text>
<path d="M210 275H245" class="flow"/><path d="M485 275H520" class="flow"/><path d="M770 275H805" class="flow"/><path d="M1015 275H1050" class="flow"/><path d="M1290 275H1325" class="flow"/>
<path d="M645 165V205M910 165V205" class="flow dash"/>
<rect x="30" y="435" width="455" height="115" class="box"/><text x="47" y="467" class="label">CI: frozen development evaluation gate</text><text x="47" y="495" class="detail">After pytest · LLM disabled · inputs fingerprinted</text><text x="47" y="523" class="detail">Category accuracy · expected-KB hit@5 · citation rate</text>
<rect x="520" y="435" width="250" height="115" class="box"/><text x="537" y="467" class="label">PostgreSQL + pgvector</text><text x="537" y="495" class="detail">Docs + vectors + text index</text><text x="537" y="523" class="detail">Owned history + shared budgets</text>
<path d="M645 435V345" class="flow"/><text x="657" y="397" class="note">Current source evidence</text>
<rect x="805" y="435" width="210" height="115" class="safe"/><text x="822" y="467" class="label">Readable local plan</text><text x="822" y="495" class="detail">Quota / invalid output</text><text x="822" y="523" class="detail">Same conditional sources</text>
<path d="M910 345V435" class="fallback"/><path d="M1015 492H1030V370H1170V345" class="fallback"/>
<rect x="1050" y="435" width="520" height="115" class="box"/><text x="1067" y="467" class="label">Monitoring</text><text x="1067" y="495" class="detail">/api/v1/health · /api/v1/ready · /metrics</text><text x="1067" y="523" class="detail">Provider / fallback / citations / cache · stage latency histograms</text>
<text x="30" y="618" class="label">Ingestion and evolution — reviewed, immutable versions</text>
<rect x="30" y="642" width="250" height="100" class="box"/><text x="47" y="675" class="label">Validate</text><text x="47" y="703" class="detail">Schema + provenance + KB refs</text><text x="47" y="728" class="detail">Exclude dev/test from index</text>
<rect x="340" y="642" width="240" height="100" class="box"/><text x="357" y="675" class="label">Stage</text><text x="357" y="703" class="detail">New corpus version + hashes</text><text x="357" y="728" class="detail">Preserve previous versions</text>
<rect x="640" y="642" width="300" height="100" class="box"/><text x="657" y="675" class="label">Incremental index</text><text x="657" y="703" class="detail">Changed chunks + embeddings only</text><text x="657" y="728" class="detail">Lock + readiness + cache invalidation</text>
<rect x="1000" y="642" width="570" height="100" class="box"/><text x="1017" y="675" class="label">Category map / model evolution</text><text x="1017" y="703" class="detail">New classes: train + calibrate + regression checks</text><text x="1017" y="728" class="detail">Activate matching corpus, model, routing and category mapping</text>
<path d="M280 692H340" class="flow"/><path d="M580 692H640" class="flow"/><path d="M940 692H1000" class="flow"/><path d="M790 642V593H645V550" class="flow"/>
<text x="30" y="794" class="note">* Modes are configurable. Current default: local understanding; Groq drafts and Gemini reviews. Missing keys retain the local plan.</text>
<text x="30" y="822" class="note">PostgreSQL FTS is the production lexical backend; BM25 remains an exploration baseline. Dashed amber arrows show local fallback.</text>
</svg>

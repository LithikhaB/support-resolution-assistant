<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Support Agent Triage Console</title>
  <link rel="stylesheet" href="/assets/style.css?v=5">
  <script src="/assets/app.js?v=9" defer></script>
</head>
<body>
  <main>
    <header><a class="brand" href="/">Support Resolution</a><button id="new-ticket" class="secondary" type="button" hidden>New complaint</button></header>
    <h1>Support agent triage console</h1>
    <p class="intro">Paste a customer complaint. Review the evidence, record observations, and approve conditional next steps.</p>
    <div id="status" role="status" aria-live="polite" hidden></div>
    <section id="intake" class="panel">
      <form id="create-form">
        <label for="complaint">Raw customer complaint</label>
        <textarea id="complaint" required maxlength="10000" rows="5" placeholder="For example: My broadband drops every evening. I have already restarted the router twice."></textarea>
        <button type="submit">Triage ticket</button>
      </form>
    </section>
    <div id="issues" aria-live="polite"></div>
    <footer>Demo knowledge base. No payments, repairs or account changes are performed. Refreshing this page starts a new conversation.</footer>
  </main>
</body>
</html>
